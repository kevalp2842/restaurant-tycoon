:root{--ink:#1d2b53;--paper:#fff1e8;--peach:#ffccaa;--org:#ffa300;--red:#ff004d;--yel:#ffec27;--grn:#00e436;--dgrn:#008751;--blue:#29adff;--plum:#7e2553;--brn:#ab5236;--gry:#c2c3c7;--dgry:#5f574f;--lav:#83769c;--pink:#ff77a8;
  --pri:#ffa300;--acc:#00e436;--dark:#1d2b53;--mut:#5f574f;
  --H:'RTHead',ui-monospace,monospace;--B:'RTBody',ui-monospace,monospace;
  --bd:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);
  --bd2:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
*{box-sizing:border-box;border-radius:0!important;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ink);font-family:var(--B);font-size:16px;line-height:1.25;-webkit-font-smoothing:none;-moz-osx-font-smoothing:unset;font-smooth:never;overscroll-behavior:none}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.spr{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.24em;image-rendering:pixelated;pointer-events:none}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;color:inherit;background:none}
input{font:inherit}
b,strong{font-weight:700}
#app{max-width:480px;margin:0 auto;height:100%;position:relative;display:flex;flex-direction:column;background-color:var(--peach);background-image:repeating-conic-gradient(#f7bf9c 0 25%,transparent 0 50%);background-size:8px 8px}
.hidden{display:none!important}
/* ---------- start ---------- */
.start{flex:1;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 30px}
.logo{text-align:center;margin:6px 0 14px}
.logo .em{font-size:60px;display:inline-block;animation:bob 1s steps(2) infinite}
.logo h1{margin:12px 0 0;font-family:var(--H);font-size:18px;line-height:1.5;font-weight:400;color:var(--red);text-shadow:3px 3px 0 var(--ink)}
.logo p{margin:8px 0 0;color:var(--dgry);font-size:17px}
.lbl{font-family:var(--H);font-size:10px;line-height:1.5;color:var(--ink);margin:22px 4px 12px}
.txt{width:calc(100% - 8px);margin:0 4px;padding:12px;border:0;background:var(--paper);font-family:var(--B);font-size:20px;font-weight:700;color:var(--ink);outline:none;box-shadow:var(--bd),inset 4px 4px 0 0 var(--gry)}
.txt:focus{box-shadow:0 -4px 0 0 var(--blue),0 4px 0 0 var(--blue),-4px 0 0 0 var(--blue),4px 0 0 0 var(--blue),inset 4px 4px 0 0 var(--gry)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:4px}
.ccard{background:var(--paper);padding:12px 6px;text-align:center;box-shadow:var(--bd),inset -4px -4px 0 0 var(--gry)}
.ccard:active{transform:translateY(3px)}
.ccard.sel{background:var(--yel);box-shadow:var(--bd),inset -4px -4px 0 0 var(--org)}
.ccard .ic{font-size:34px}
.ccard b{display:block;font-family:var(--H);font-weight:400;font-size:10px;line-height:1.6;margin-top:6px}
.ccard small{display:block;color:var(--dgry);font-size:14px;margin-top:4px;min-height:34px}
/* ---------- buttons ---------- */
.btn{display:block;width:calc(100% - 8px);margin:22px 4px 8px;padding:15px 8px 17px;font-family:var(--H);font-size:12px;line-height:1.5;font-weight:400;color:var(--ink);background:var(--org);box-shadow:var(--bd),inset -4px -6px 0 0 var(--brn),inset 4px 4px 0 0 #ffd27a}
.btn:active{transform:translateY(4px);box-shadow:var(--bd),inset 4px 4px 0 0 var(--brn)}
.btn.teal{background:var(--grn);box-shadow:var(--bd),inset -4px -6px 0 0 var(--dgrn),inset 4px 4px 0 0 #9dffb4}
.btn.teal:active{box-shadow:var(--bd),inset 4px 4px 0 0 var(--dgrn)}
.btn.gray{background:var(--gry);box-shadow:var(--bd),inset -4px -6px 0 0 var(--dgry),inset 4px 4px 0 0 #e8e8ec}
.sbtn{padding:9px 9px 11px;margin:4px;font-family:var(--H);font-size:9px;line-height:1.4;font-weight:400;color:var(--ink);background:var(--org);min-width:44px;min-height:40px;box-shadow:var(--bd2),inset -3px -4px 0 0 var(--brn),inset 3px 3px 0 0 #ffd27a}
.sbtn:active{transform:translateY(3px);box-shadow:var(--bd2),inset 3px 3px 0 0 var(--brn)}
.sbtn.teal{background:var(--grn);box-shadow:var(--bd2),inset -3px -4px 0 0 var(--dgrn),inset 3px 3px 0 0 #9dffb4}

.segb{background:var(--red);color:var(--paper);padding:1px 4px;margin-left:2px}
.board{background-color:#123b2b;background-image:repeating-conic-gradient(#164a36 0 25%,transparent 0 50%);background-size:4px 4px;color:var(--paper);padding:12px 12px 10px;margin:4px 4px 18px;box-shadow:0 0 0 4px #ab5236,0 0 0 8px var(--ink)}
.bhd{font-family:var(--H);font-size:10px;line-height:1.6;text-align:center;color:var(--yel);margin-bottom:8px}
.bslot{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:6px 8px;margin:0 0 8px;border:2px dashed #6b9c86;color:var(--paper);font-size:15px;text-align:left}
.bslot.add{justify-content:center;color:#9fd8bd;font-weight:700}
.bslot.lock{justify-content:center;color:#6b9c86;font-size:13px}
.bse{font-size:28px;width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;background:#0c2a1f}
.bsn{font-weight:700;font-size:15px;line-height:1.2}
.bsm{font-size:13px;color:#cde8db}.bsm s{opacity:.6}
.bslot .bx{font-size:16px;padding:4px 7px 6px}
.bft{font-size:12px;color:#9fd8bd;line-height:1.3}
.heat{display:inline-flex;gap:2px;vertical-align:middle}
.heat i{width:7px;height:10px;background:var(--gry)}
.heat i.f0{background:var(--paper);box-shadow:inset 0 0 0 1px var(--dgry)}.heat i.f1{background:var(--grn)}.heat i.f2{background:var(--yel)}.heat i.f3{background:var(--org)}.heat i.f4{background:var(--red)}
.dish button.de{position:relative;padding:0}
.de .info{position:absolute;right:-5px;bottom:-5px;width:15px;height:15px;font-style:normal;font-family:var(--H);font-size:8px;line-height:15px;text-align:center;background:var(--blue);box-shadow:var(--bd2)}
.dn[data-act]{cursor:pointer;text-decoration:underline dotted 2px;text-underline-offset:3px}
.fr{display:inline-flex;align-items:center;gap:2px;padding:1px 4px;margin:3px 4px 0 0;font-weight:700;font-size:13px;background:var(--paper);box-shadow:var(--bd2)}
.fr small{font-weight:400;font-size:11px;margin-left:2px;color:var(--dgry)}
.fr.fresh{background:#c9f7d3}.fr.soon{background:var(--yel);animation:blink2 1s steps(1) infinite}.fr.exp{background:var(--pink)}.fr.out{background:var(--gry);color:var(--dgry)}
@keyframes blink2{50%{background:#fff7a8}}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dgry);margin-top:8px}
.ing{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--gry)}
.ing:last-child{border-bottom:0}
.ing .ie,.ilist .ie{font-size:24px;width:34px;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;background:var(--peach);box-shadow:var(--bd2)}
.ing .dn{font-size:15px}
.buys{display:flex;flex-direction:column;gap:8px}
.buys .sbtn{padding:6px 8px 8px;font-size:12px}
.frs{display:flex;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px;font-weight:700;font-size:14px;background:var(--paper);box-shadow:var(--bd2)}
.toggle small{font-weight:400;color:var(--dgry)}
.toggle .knob{width:34px;height:18px;flex:0 0 34px;background:var(--gry);position:relative;box-shadow:var(--bd2)}
.toggle .knob:after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--paper);box-shadow:0 0 0 2px var(--ink)}
.toggle.on .knob{background:var(--grn)}.toggle.on .knob:after{left:18px}
.card.hint{background:#c7f0ff}
.card.hint p{margin:6px 0 8px;font-size:14px;line-height:1.35}
.blend{display:flex;gap:10px;align-items:center;padding:8px 6px;margin:6px 0;box-shadow:var(--bd2)}
.blend.on{background:#e4ffd9}
.blend .be{font-size:24px}
.dd h4{font-family:var(--H);font-size:9px;line-height:1.6;margin:16px 0 6px}
.ddesc{font-style:italic;font-size:15px;line-height:1.35;background:var(--peach);padding:8px 10px;box-shadow:var(--bd2)}
.ilist,.mlist{margin:0;padding:0}
.ilist li{display:flex;align-items:center;gap:8px;list-style:none;padding:4px 0;font-size:14px;line-height:1.25}
.ilist .ie{font-size:18px;width:26px;height:26px;flex:0 0 26px}.ilist .ie.dot{background:none;box-shadow:none}
.mlist{padding-left:22px}.mlist li{font-size:14px;line-height:1.3;margin:4px 0}
.heatsel{display:flex;gap:6px}
.heatsel button{flex:1;padding:6px 0 7px;background:var(--paper);font-size:18px;box-shadow:var(--bd2),inset -2px -3px 0 0 var(--gry);display:flex;flex-direction:column;align-items:center}
.heatsel button small{font-size:10px;font-weight:700}
.heatsel button.on{background:var(--org);box-shadow:var(--bd2),inset 2px 2px 0 0 var(--brn)}
.fans{font-size:13px;margin:8px 0;line-height:1.4}
.sbtn.wide{width:100%;margin-top:6px;font-size:12px;line-height:1.5}
.goals{background:var(--paper);margin:4px 4px 16px;padding:8px 10px;box-shadow:var(--bd2)}
.ghd{font-family:var(--H);font-size:9px;line-height:1.6;display:flex;justify-content:space-between;margin-bottom:4px}
.goal{display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.2;padding:4px 0}
.goal b{font-size:13px;color:var(--dgrn)}
.goal.done{color:var(--dgry)}.goal.done .grow{text-decoration:line-through}
.gbar{height:5px;background:var(--gry);margin-top:3px;position:relative}
.gbar i{display:block;height:100%;background:var(--grn)}
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 2px;background:#e8e8ea;color:var(--dgry);box-shadow:var(--bd2);font-size:12px;line-height:1.2;min-width:0}
.ach .ae{font-size:22px}.ach b{font-size:12px;margin:2px 0}.ach small{font-size:10px}.ach .ar{font-weight:700;margin-top:2px}
.ach.got{background:var(--yel);color:var(--ink)}
.tbl .tapme{position:absolute;right:4px;bottom:12px;font-size:16px;animation:wig .6s steps(2) infinite}
.tbl .coin{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:26px;z-index:5;animation:coinb .5s steps(2) infinite;padding:4px}
@keyframes coinb{50%{margin-top:-5px}}
.banner.fest{background:var(--org)}
.banner.oos{background:var(--red);color:var(--paper);width:calc(100% - 8px);text-align:left;font-family:var(--B)}
button.banner.sp{width:calc(100% - 8px);text-align:left;font-family:var(--B)}
.card.combo{background:#c7f0ff}
.tag.wrap{white-space:normal}
.evd{position:relative}
.evtag{font-family:var(--H);font-size:7px;line-height:1.5;color:var(--paper);background:var(--plum);display:inline-block;padding:4px 6px 3px;margin:0 0 10px}
.evtitle{font-family:var(--H);font-size:12px;line-height:1.6;margin:0 0 12px}
.evhead{display:flex;gap:12px;align-items:center;margin:0 4px 14px}
.evpor{font-size:46px;width:72px;height:72px;flex:0 0 72px;display:flex;align-items:center;justify-content:center;background-color:var(--blue);background-image:repeating-conic-gradient(#5cc2ff 0 25%,transparent 0 50%);background-size:8px 8px;box-shadow:var(--bd),inset 0 -6px 0 0 #1a7fc2;animation:bob 1s steps(2) infinite}
.evname{font-family:var(--H);font-size:10px;line-height:1.6}
.evtext{background:var(--ink);color:var(--paper);padding:12px 12px 16px;margin:4px 4px 16px;font-size:16px;line-height:1.35;position:relative;box-shadow:0 -4px 0 0 var(--paper),0 4px 0 0 var(--paper),-4px 0 0 0 var(--paper),4px 0 0 0 var(--paper),0 0 0 8px var(--ink);animation:reveal .5s steps(8)}
.evcur{position:absolute;right:8px;bottom:2px;font-size:10px;color:var(--yel);animation:blink .8s steps(1) infinite}
.evopts{display:flex;flex-direction:column;gap:12px;padding:4px}
.evopt{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px 10px;background:var(--paper);font-size:16px;font-weight:700;line-height:1.2;box-shadow:var(--bd2),inset -3px -4px 0 0 var(--gry)}
.evopt:active{transform:translateY(3px);box-shadow:var(--bd2),inset 3px 3px 0 0 var(--gry)}
.evopt small{display:block;font-weight:400;font-size:13px;color:var(--dgry);margin-top:2px}
.evk{font-family:var(--H);font-size:10px;width:28px;height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:center;background:var(--org);box-shadow:var(--bd2),inset -2px -3px 0 0 var(--brn)}
.evopt:nth-child(2) .evk{background:var(--grn);box-shadow:var(--bd2),inset -2px -3px 0 0 var(--dgrn)}
.evopt:nth-child(3) .evk{background:var(--blue);box-shadow:var(--bd2),inset -2px -3px 0 0 #1a7fc2}
.evopt:nth-child(4) .evk{background:var(--pink);box-shadow:var(--bd2),inset -2px -3px 0 0 var(--plum)}
.evfx{display:flex;flex-wrap:wrap;gap:4px;margin:0 2px 4px}
.buffrow{display:flex;flex-wrap:wrap;gap:2px;margin:0 2px 12px}
.logi{padding:8px 0;border-bottom:2px dashed var(--gry);font-size:15px}
.logi:last-child{border-bottom:0}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes blink{50%{opacity:0}}
.pricer .sbtn,.dish .sbtn.red{font-family:var(--B);font-size:22px;font-weight:700;line-height:1;padding:6px 8px 9px}
.slot.empty{font-family:var(--H)}
/* compact layout for big restaurants */
.room.compact .tables{grid-template-columns:repeat(4,1fr);gap:10px;row-gap:20px}
.room.compact .tbl{height:70px}
.room.compact .tbl .cu{font-size:22px;left:4px;top:5px}
.room.compact .tbl .bb{font-size:14px}
.room.compact .tbl .pl{font-size:18px;bottom:10px}
.room.compact .tbl .tt{font-size:22px}
.room.compact .tbl .badge{left:26px}
.room.compact .tbl .nm{display:none}
.room.compact .say{font-size:11px;left:-8px;right:-8px}
/* ================= v5 DESIGN SYSTEM · clean premium pixel =================
   Restrained palette: ink + cream surfaces, ONE accent (amber) and semantic colours
   (green = money/success, gold = rewards/attention, red = warnings). Spacing scale 4/8/12/16/24. */
:root{--ink:#2a2238;--paper:#fff8ec;--peach:#f3e3c8;--org:#e8892b;--brn:#a85a1c;--yel:#f2c14e;--grn:#4caf6a;--dgrn:#2e7d4a;--red:#d64545;--pink:#f6d3cd;--blue:#5b8fc7;--plum:#3d3150;--lav:#6e6584;--gry:#e6d8c0;--dgry:#7a6c62;
  --bg:#efe2cb;--line:#eadcc6;--ok-t:#dcefd9;--warn-t:#fbeac0;--bad-t:#f6d3cd;--info-t:#e4e8f1;--acc-t:#fbdcbc;--dark2:#3b3150;
  --bd:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);
  --bd2:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);
  --soft:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line);
  --drop:0 6px 0 -2px rgba(42,34,56,.16)}
html,body{font-size:15px}
#app{background:var(--bg)}
.muted{font-size:13px;color:var(--dgry);line-height:1.3}
b,.kv b,.pv,.today b,.chip,.clock,.fr,.goal b,.ar{font-variant-numeric:tabular-nums}
/* buttons: one primary (accent) per screen, everything else neutral */
.btn{margin:20px 2px 6px;width:calc(100% - 4px);padding:14px 8px 16px;font-size:11px;color:#fff8ec;background:var(--org);box-shadow:var(--bd),inset 0 -4px 0 0 var(--brn);text-shadow:0 2px 0 var(--brn)}
.btn:active{transform:translateY(2px);box-shadow:var(--bd),inset 0 -2px 0 0 var(--brn)}
.btn.teal{background:var(--org);box-shadow:var(--bd),inset 0 -4px 0 0 var(--brn)}
.btn.teal:active{box-shadow:var(--bd),inset 0 -2px 0 0 var(--brn)}
.btn.gray{background:var(--paper);color:var(--ink);text-shadow:none;box-shadow:var(--bd),inset 0 -4px 0 0 var(--gry)}
.sbtn{margin:4px;padding:9px 10px 11px;min-height:38px;font-size:9px;color:var(--ink);background:var(--paper);box-shadow:var(--bd2),inset 0 -3px 0 0 var(--gry)}
.sbtn:active{transform:translateY(2px);box-shadow:var(--bd2),inset 0 -1px 0 0 var(--gry)}
.sbtn.teal{background:var(--org);color:#fff8ec;box-shadow:var(--bd2),inset 0 -3px 0 0 var(--brn)}
.sbtn.ghost{background:transparent;color:var(--dgry);box-shadow:var(--soft)}
.sbtn.red{background:var(--paper);color:var(--red);box-shadow:var(--bd2),inset 0 -3px 0 0 var(--pink)}
.sbtn[disabled],.btn[disabled]{opacity:.4;filter:none}
.pricer .sbtn,.dish .sbtn.red{font-size:20px;padding:4px 8px 7px;min-height:34px;min-width:38px}
/* header */
.hdr{padding:calc(10px + env(safe-area-inset-top)) 12px 10px;box-shadow:0 3px 0 0 rgba(0,0,0,.25);margin-bottom:0}
.rname{font-size:10px}
.chip{background:rgba(255,248,236,.09);padding:6px 8px 5px;font-size:9px;box-shadow:none}
#hmoney{background:rgba(76,175,106,.22);color:#a6e3b5}#hrep{background:rgba(242,193,78,.18);color:var(--yel)}
#hday{background:rgba(255,248,236,.09)}
.chip.mute{background:transparent;padding:4px;box-shadow:none;opacity:.8}
.lvl{background:rgba(255,248,236,.09);box-shadow:none;padding:6px 8px 5px}
.xpbar{height:8px;box-shadow:none;background:#15111d}
.xpbar i{background:var(--yel)}
.stats{gap:8px}
/* views & cards */
.view{padding:16px 12px 110px}
.card{padding:16px 14px;margin:2px 2px 18px;box-shadow:var(--bd),var(--drop)}
.card h3{font-size:10px;margin:0 0 12px;letter-spacing:.5px}
.mcard .card{box-shadow:var(--soft);margin:12px 2px;background:#fffdf7}
.card.soft,.card.tip,.card.hl,.card.combo,.card.hint{box-shadow:var(--soft)}
.card.soft{background:#fff3e0}.card.tip{background:var(--warn-t)}.card.hl{background:var(--acc-t)}.card.combo,.card.hint{background:var(--info-t)}
.card.danger{background:var(--bad-t);box-shadow:0 -2px 0 0 var(--red),0 2px 0 0 var(--red),-2px 0 0 0 var(--red),2px 0 0 0 var(--red)}
.kv{padding:8px 0;font-size:14px;border-bottom:2px solid var(--line);align-items:baseline}
.dish,.up,.eqcard,.staffcard,.rev,.ing,.logi{border-bottom:2px solid var(--line)}
.tag{padding:2px 6px 3px;margin:4px 4px 0 0;font-size:12px;box-shadow:none;background:var(--gry);color:var(--ink)}
.tag.g{background:var(--ok-t);color:var(--dgrn)}.tag.y{background:var(--acc-t);color:var(--brn)}.tag.o{background:var(--warn-t);color:#8a6312}.tag.r{background:var(--bad-t);color:#a53030}.tag.b{background:var(--info-t);color:#3b5f8a}
.trait{background:var(--info-t);color:#3b5f8a;box-shadow:none;font-size:12px}
.pos{color:var(--dgrn)}.neg{color:var(--red)}
/* nav: readable labels, single accent indicator */
.nav{box-shadow:0 -2px 0 0 rgba(0,0,0,.3);padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{font-family:var(--B);font-size:12px;font-weight:700;letter-spacing:.5px;color:#a99fb5;padding:6px 0 5px}
.nav button span{font-size:20px}
.nav button.on{color:#fff8ec;background:transparent;box-shadow:inset 0 3px 0 0 var(--org)}
.nav button.on span{animation:none}
.nav .dot{background:var(--org)}
/* floor HUD */
.clockbar{margin:0 2px 12px;gap:8px}
.clock{font-size:9px;padding:8px 8px 7px;box-shadow:var(--bd2)}
.dprog{height:8px;box-shadow:none;background:var(--gry)}
.dprog:after{display:none}
.dprog i{background:var(--org)}
.speeds{gap:4px}
.speeds button{min-width:32px;height:32px;box-shadow:var(--bd2),inset 0 -3px 0 0 var(--gry)}
.speeds button.on{background:var(--ink);color:#fff8ec;box-shadow:var(--bd2)}
#openWrap .btn{margin:0 2px 16px!important}
.banner{display:block;padding:9px 12px 9px 16px;margin:0 2px 8px;font-size:14px;line-height:1.3;font-weight:700;background:var(--paper);color:var(--ink);box-shadow:var(--bd2),inset 5px 0 0 0 var(--org);animation:slidein .25s steps(2)}
.banner.sp{background:var(--paper)}
.banner.cr{background:var(--paper);box-shadow:var(--bd2),inset 5px 0 0 0 var(--ink)}
.banner.bz{box-shadow:var(--bd2),inset 5px 0 0 0 var(--blue)}
.banner.fest{box-shadow:var(--bd2),inset 5px 0 0 0 var(--yel)}
.banner.oos{background:var(--bad-t);color:#8f2626;box-shadow:var(--bd2),inset 5px 0 0 0 var(--red)}
#banners{margin-bottom:8px}
.buffrow{gap:0;margin:0 2px 8px}
.goals{margin:0 2px 16px;padding:12px 14px 10px;box-shadow:var(--bd2)}
.ghd{font-size:9px;margin-bottom:6px;color:var(--ink)}
.ghd span{color:var(--dgry)}
.goal{font-size:13px;padding:5px 0}
.goal .gc .spr{width:14px;height:14px}
.goal b{font-family:var(--H);font-size:8px;color:var(--dgrn)}
.gbar{height:4px;background:var(--gry);margin-top:4px}
.gbar i{background:var(--grn)}
.room{margin:2px;padding:12px 10px;background-color:#ead2b2;background-image:repeating-conic-gradient(#e6cba8 0 25%,transparent 0 50%);background-size:32px 32px;box-shadow:var(--bd),var(--drop)}
.room.d2,.room.d3{background-color:#e7d8c3;background-image:repeating-conic-gradient(#e1d0b8 0 25%,transparent 0 50%);box-shadow:var(--bd),var(--drop)}
.room.d4,.room.d5{background-color:#ddd3e2;background-image:repeating-conic-gradient(#d6cbdc 0 25%,transparent 0 50%);box-shadow:var(--bd),var(--drop)}
.decor{opacity:.85}
.door{margin:2px 2px 16px;box-shadow:var(--bd2);min-height:48px}
.doorsay{font-size:13px;color:var(--dgry)}
.area{margin:2px 2px 16px;padding:30px 8px 12px;box-shadow:none}
.a-diner{padding-top:26px}
.alab{top:8px;left:8px;font-family:var(--B);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.75}
.alab .spr{width:13px;height:13px}
.a-patio{background-color:#d3e3c3;background-image:repeating-conic-gradient(#cbdcb9 0 25%,transparent 0 50%);background-size:16px 16px}
.a-hall{background-color:#dbe4ee;background-image:repeating-conic-gradient(#d2dce8 0 25%,transparent 0 50%);background-size:24px 24px}
.a-bar{background:repeating-linear-gradient(0deg,#b98a63 0 12px,#ad7f59 12px 14px);color:#fff8ec}
.a-vip{background-color:#4a3c5e;background-image:none;color:var(--yel);box-shadow:inset 0 0 0 2px var(--yel)}
.tables{gap:12px;row-gap:24px}
.tbl{height:88px;box-shadow:var(--bd2),inset 0 -4px 0 0 var(--gry)}
.tbl .tt{opacity:.22}
.tbl .bb{box-shadow:var(--soft);background:#fffdf7}
.tbl .nm{font-size:12px;bottom:10px}
.tbl .wb{height:4px;left:8px;right:8px;bottom:3px;background:var(--gry)}
.tbl .wb:after{display:none}
.tbl.vip{box-shadow:0 -2px 0 0 var(--yel),0 2px 0 0 var(--yel),-2px 0 0 0 var(--yel),2px 0 0 0 var(--yel),inset 0 -4px 0 0 var(--gry)}
.tbl.bar{background:var(--paper);box-shadow:var(--bd2),inset 0 -4px 0 0 #b98a63}
/* speech bubbles: confined to their own table/staff tile, max two lines, never overlap neighbours */
.say{left:0;right:0;top:-14px;padding:3px 6px 4px;font-size:12px;line-height:1.15;font-weight:700;box-shadow:var(--bd2);background:#fffdf7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left;animation:pop .15s steps(2)}
.say:after{display:none}
.say.good{background:#e6f5e3}.say.bad{background:#fbe1dc}
.room.compact .say{font-size:11px;left:0;right:0}
.kitchen{margin:4px 2px 2px;padding:12px 10px;background-color:var(--dark2);background-image:none;box-shadow:none}
.klab{font-family:var(--B);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#cfc4dc;opacity:1;margin:0 2px 8px}
.krow{gap:10px;margin-bottom:12px}
.st{width:100px;min-width:0;padding:6px 8px 10px;background:#2a2238;box-shadow:0 0 0 2px #5d5174}
.st.busy{background:#2a2238;box-shadow:0 0 0 2px var(--org)}
.st .say{top:-16px;left:-2px;right:-2px;min-width:0;max-width:none;color:var(--ink)}
.st .nm{font-size:12px;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.st .pb{height:3px;background:#15111d}
.st .pb:after{display:none}
.st .pb i{background:var(--org)}
.eqi{background:#2a2238;box-shadow:0 0 0 2px #5d5174}
.eqi small{font-size:8px;color:var(--yel)}

function evOk(e) {

    S.evQueue.splice(i, 1); i--;

  const pool = EVENTS.filter(e => !e.follow && !e.story && e.when.includes(when) && evOk(e)).map(e => ({e, w:e.w() * (S.evRecent.includes(e.id) ? 0.25 : 1)})).filter(x => x.w > 0);

/* =================== FX =================== */
function toast(msg, cls) {
  const t = document.createElement('div'); t.className = 'toast ' + (cls || ''); t.innerHTML = msg;
  const box = document.getElementById('toasts'); box.appendChild(t);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => t.remove(), 3100);
}
const FLT = new Map();
function floatAt(el, text, color) {
  if (!el || tab !== 'floor') return;
  // throttle: at most one float per table every 600ms, and never more than 6 on screen
  const tn = now(), lastF = FLT.get(el) || 0; if (tn - lastF < 600 || document.querySelectorAll('#fx .fl').length >= 6) return; FLT.set(el, tn);
  const r = el.getBoundingClientRect(); if (!r.width) return;
  const f = document.createElement('div'); f.className = 'fl'; f.textContent = text; f.style.color = color || '#2a2238';
  f.style.left = clamp(r.left + r.width / 2, 60, innerWidth - 60) + 'px'; f.style.top = (r.top + 4) + 'px';
  document.getElementById('fx').appendChild(f); setTimeout(() => f.remove(), 1300);
}
function confetti(n) {
  // subtle feedback: a small burst of palette-coloured pixel squares, no emoji storm
  n = Math.min(10, Math.ceil((n || 24) / 2));
  const cols = ['#e8892b', '#f2c14e', '#4caf6a', '#5b8fc7', '#fff8ec'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'confetti px'; c.style.background = rnd(cols);
    c.style.left = (15 + Math.random() * 70) + 'vw'; c.style.animationDuration = (1.2 + Math.random() * .8) + 's'; c.style.animationDelay = Math.random() * .25 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 2600);
  }
}
function showModal(html) { const m = document.getElementById('modal'); m.innerHTML = `<div class="mcard">${html}</div>`; m.classList.remove('hidden'); }
function hideModal() { document.getElementById('modal').classList.add('hidden'); if (S) renderAll(); }

/* =================== LOOP =================== */
let last = performance.now(), acc = 0, hdrAcc = 0;
function loop(t) {
  const dt = Math.min(0.25, (t - last) / 1000); last = t;
  try {
    if (S && sim && sim.running && !paused) {
      let simDt = dt * speed;
      while (simDt > 0 && sim.running && !paused) { const s = Math.min(0.05, simDt); step(s); simDt -= s; }
    }
    acc += dt; hdrAcc += dt;
    if (S && acc > 0.08) { acc = 0; renderFloor(false); }
    if (S && hdrAcc > 0.3) { hdrAcc = 0; if (document.getElementById('hmoney')) { renderHeader(); refreshAfford(); } }
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && sim && sim.running) { paused = true; renderSpeeds(); if (S) save(); } });
window.addEventListener('pagehide', () => { if (S) save(); });

/* =================== PIXEL SPRITES ===================
   Every emoji in the UI is redrawn as a tiny low-res sprite (24×24), snapped to a
   32-colour retro palette, given a 1px dark outline and scaled up with crisp pixels. */
const PAL = ['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8','#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa',
  '#291814','#111d35','#422136','#125359','#742f29','#49333b','#a28879','#f3ef7d','#be1250','#ff6c24','#a8e72e','#00b543','#065ab5','#754665','#ff6e59','#ff9d81']
  .map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const EMO_RE = /\p{Regional_Indicator}{2}|[#*0-9]\uFE0F?\u20E3|\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\p{Emoji_Modifier})?)*/gu;
const EMO_TEST = /\p{Extended_Pictographic}|\p{Regional_Indicator}/u;
const SPRITES = new Map();
let sprCanvas = null;
function isSpriteable(e) { return /\uFE0F|\u200D|\p{Emoji_Modifier}|\p{Regional_Indicator}|\u20E3/u.test(e) || /\p{Emoji_Presentation}/u.test(e); }
function sprite(e) {
  if (SPRITES.has(e)) return SPRITES.get(e);
  let url = null;
  try {
    const N = 24, P = 1, W = N + P * 2;
    if (!sprCanvas) sprCanvas = document.createElement('canvas');
    const c = sprCanvas; c.width = W; c.height = W;
    const x = c.getContext('2d', {willReadFrequently:true});
    x.clearRect(0, 0, W, W);
    x.font = `${N - 3}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif`;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(e, W / 2, W / 2 + 1);
    const img = x.getImageData(0, 0, W, W), d = img.data, solid = new Uint8Array(W * W);
    let any = false;
    for (let i = 0; i < W * W; i++) {
      const a = d[i * 4 + 3];
      if (a < 110) { d[i * 4 + 3] = 0; continue; }
      // un-premultiply edge pixels, then snap to the palette
      const k = 255 / a, r = Math.min(255, d[i * 4] * (a < 255 ? k : 1)), g = Math.min(255, d[i * 4 + 1] * (a < 255 ? k : 1)), b = Math.min(255, d[i * 4 + 2] * (a < 255 ? k : 1));
      let best = 0, bd = 1e9;
      for (let p = 0; p < PAL.length; p++) { const q = PAL[p], dd = (r - q[0]) ** 2 * 0.3 + (g - q[1]) ** 2 * 0.59 + (b - q[2]) ** 2 * 0.11; if (dd < bd) { bd = dd; best = p; } }
      d[i * 4] = PAL[best][0]; d[i * 4 + 1] = PAL[best][1]; d[i * 4 + 2] = PAL[best][2]; d[i * 4 + 3] = 255;
      solid[i] = 1; any = true;
    }
    if (!any) { SPRITES.set(e, null); return null; }
    for (let y = 0; y < W; y++) for (let xx = 0; xx < W; xx++) {           // 1px outline
      const i = y * W + xx; if (solid[i]) continue;
      if ((xx > 0 && solid[i - 1]) || (xx < W - 1 && solid[i + 1]) || (y > 0 && solid[i - W]) || (y < W - 1 && solid[i + W])) { d[i * 4] = 29; d[i * 4 + 1] = 43; d[i * 4 + 2] = 83; d[i * 4 + 3] = 255; }
    }
    x.putImageData(img, 0, 0);
    url = c.toDataURL();
  } catch (err) { url = null; }
  SPRITES.set(e, url);
  return url;
}
function spriteTextNode(n) {
  const s = n.nodeValue, p = n.parentNode;
  if (!s || !p || !EMO_TEST.test(s) || /^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION|TITLE)$/.test(p.nodeName)) return;
  EMO_RE.lastIndex = 0;
  let m, last = 0, changed = false;
  const frag = document.createDocumentFragment();
  while ((m = EMO_RE.exec(s))) {
    const e = m[0];
    if (!isSpriteable(e)) continue;
    const url = sprite(e);
    if (!url) continue;
    if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
    const im = document.createElement('img'); im.className = 'spr'; im.src = url; im.alt = e; im.draggable = false;
    frag.appendChild(im); last = m.index + e.length; changed = true;
  }
  if (!changed) return;
  if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
  p.replaceChild(frag, n);
}
function spriteTree(root) {
  if (root.nodeType === 3) { spriteTextNode(root); return; }
  if (root.nodeType !== 1 || !EMO_TEST.test(root.textContent || '')) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  while (w.nextNode()) list.push(w.currentNode);
  list.forEach(spriteTextNode);
}
const sprObserver = new MutationObserver(muts => {
  for (const m of muts) {
    if (m.type === 'characterData') spriteTextNode(m.target);
    else m.addedNodes.forEach(spriteTree);
  }
});
sprObserver.observe(document.body, {childList:true, subtree:true, characterData:true});
function setT(el, v) { if (el && el.dataset.t !== v) { el.dataset.t = v; el.textContent = v; } }

function settleInterrupted(live) {
  // reloading mid-service no longer replays the day: the shift closes early, guests inside walk out, and costs are charged
  const T = Object.assign({served:0, lost:0, turned:0, sales:0, drinks:0, tips:0, food:0, ratingSum:0, xp:0, critic:null, newRegs:[], drinkCount:{}, dish:{}, specials:0, bestStreak:0, goals:0, oosLost:0, events:[]}, live.T);
  T.lost += live.open || 0;
  T.events = (T.events || []).concat([`⚡ Service was interrupted at ${Math.round(100 * live.at / DAY)}% of the day: ${live.open || 0} guests walked out`]);
  sim = {T, oos:{}, running:true, ended:false, tables:[], queue:[], coins:{}, interrupted:true};
  endDay();
}
function showV6New() {
  showModal(`<div class="big">📖</div><h2>Version 6: The Golden Fork</h2><p class="muted" style="text-align:center">Your restaurant is safe. A new year starts today (${dateStr()}).</p>
  <div class="kv"><span>🍴 A year-long story: six chapters, recurring characters, multiple endings</span></div>
  <div class="kv"><span>💸 Real running costs: rent, upkeep and wages rise as you grow, and debt can close you down</span></div>
  <div class="kv"><span>🚶 Walk-outs now hurt your rating and reputation</span></div>
  <div class="kv"><span>🏅 Award projects, equipment resale, New Game+</span></div>
  <button class="btn" data-act="closeModal">Let's go! 🎉</button>`);
}
/* =================== BOOT =================== */
S = load();
if (S) {
  const wasOld = !S.pantry, off = wasOld ? null : offlineEarnings();
  if (wasOld) { S.pantry = {}; restock(0); S.seenV5 = true; }
  ensureGoals();
  if (off) S.money += off.amt;
  const live = S.live && S.live.day === S.day ? S.live : null; delete S.live;
  save(); showGame();
  if (live) settleInterrupted(live);
  else if (S.ending && !S.freePlay) showEnding(S.ending.id, true);
  else if (S.v6new) { delete S.v6new; save(); showV6New(); }
  else if (wasOld && !S.migratedFrom) showWhatsNew();
  else if (off) showModal(`<div class="big">🌙</div><h2>Welcome back!</h2><p class="muted" style="text-align:center">While you were away for ${off.hours >= 1 ? off.hours.toFixed(1) + ' hours' : Math.round(off.hours * 60) + ' minutes'}, your 🥡 takeaway window kept selling.</p><div class="kv" style="font-size:18px"><span><b>Takeaway earnings</b></span><b class="pos">+${fmt(off.amt)}</b></div><p class="muted" style="text-align:center">Earnings grow with your level, reputation & locations (max 8 hours).</p><button class="btn" data-act="closeModal">💰 Collect</button>`);
  else if (S.migratedFrom) { delete S.migratedFrom; save(); showModal(`<div class="big">🏗️</div><h2>Big update!</h2><p class="muted" style="text-align:center">Your restaurant is safe. New: guest personalities, staff traits & moods, building expansions and kitchen equipment. Your old tables & kitchen upgrades were converted.</p><button class="btn" data-act="closeModal">Let's see! 🎉</button>`); afterClose = () => showWhatsNew(); }
  else if (S.day > 1) toast(`👋 Welcome back to ${esc(S.name)}!`, 'good');
} else showStart();
requestAnimationFrame(loop);

</script>
